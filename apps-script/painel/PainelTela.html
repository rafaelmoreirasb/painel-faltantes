<!DOCTYPE html>
<html lang="pt-BR">
<head>

<meta charset="utf-8">
<title>Faltantes na Aduana · SSP53</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
  /* Visual igual ao sistema "Gestão de Processo e Qualidade" (cores DHL, Barlow, JetBrains Mono) */
  :root {
    --amarelo: #FFCC00; --amarelo-claro: #FFF5CC; --vermelho: #D40511; --vermelho-escuro: #A0040D; --vermelho-claro: #F9DADB;
    --preto: #1A1A1A; --branco: #FFFFFF; --cinza-fundo: #F2F2F2; --cinza-borda: #D9D9D9; --cinza-campo: #B3B3B3;
    --cinza-texto: #595959; --cinza-subtitulo: #4D4D4D; --cinza-linha: #E0E0E0; --cinza-zebra: #FAFAFA; --cinza-apagado: #808080;
    --verde: #1B6B2A; --verde-claro: #E3F4E1; --ambar: #9A5B00;
    --raio: 4px; --raio-cartao: 6px;
    --fonte: 'Barlow', system-ui, sans-serif; --f-mono: 'JetBrains Mono', ui-monospace, monospace;
    /* nomes usados pelo código da tela */
    --bg: var(--cinza-fundo); --panel: var(--branco); --sunk: var(--cinza-zebra); --fg: var(--preto); --muted: var(--cinza-texto);
    --line: var(--cinza-borda); --accent: var(--vermelho); --bad: var(--vermelho); --warn: var(--ambar); --ok: var(--verde);
    --open: var(--cinza-apagado); --man: var(--preto); --new-bg: var(--amarelo-claro); --new-fg: var(--preto);
    color-scheme: light;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body { min-height: 100vh; background: var(--bg); color: var(--fg); font-family: var(--fonte); font-size: 15px; line-height: 1.4; }
  input, select, textarea, button { font-family: inherit; }
  a { color: var(--vermelho); font-weight: 600; } a:hover { color: var(--vermelho-escuro); }

  /* Cabeçalho amarelo DHL com faixa vermelha */
  .cabecalho { background: var(--amarelo); color: var(--preto); border-bottom: 4px solid var(--vermelho); }
  .cabecalho-conteudo { max-width: 1320px; margin: 0 auto; padding: 16px 20px; display: flex; flex-wrap: wrap; gap: 12px 16px; align-items: center; justify-content: space-between; }
  .marca { display: flex; align-items: center; gap: 12px; }
  .marca-logo { height: 40px; width: 141px; display: block; }
  .marca-titulo { font-weight: 800; font-size: 18px; letter-spacing: -0.01em; }
  .marca-subtitulo { font-size: 12px; color: var(--cinza-subtitulo); }
  .status { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 10px; font-size: 13px; color: var(--cinza-subtitulo); }
  .dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; background: var(--verde); margin-right: 6px; border: 1px solid rgba(0,0,0,.25); }
  .dot.off { background: var(--vermelho); } .dot.load { background: var(--branco); }

  .wrap { max-width: 1320px; margin: 0 auto; padding: 24px 20px 48px; display: flex; flex-direction: column; gap: 20px; }
  h1 { margin: 0; font-size: 30px; font-weight: 800; letter-spacing: -0.02em; }
  h2 { margin: 0; font-size: 20px; font-weight: 700; }

  /* Botões e campos */
  button { height: 40px; padding: 0 16px; border-radius: var(--raio); font-size: 14px; font-weight: 700; cursor: pointer;
    border: 1px solid var(--preto); background: var(--branco); color: var(--preto); }
  button:hover:not(:disabled) { background: var(--amarelo-claro); }
  button:disabled { opacity: .6; cursor: wait; }
  #btnAtualizar { border: 0; background: var(--vermelho); color: var(--branco); }
  #btnAtualizar:hover:not(:disabled) { background: var(--vermelho-escuro); }
  select, input { height: 40px; padding: 0 12px; border: 1px solid var(--cinza-campo); border-radius: var(--raio); font-size: 15px; background: var(--branco); color: var(--preto); }
  select { font-weight: 600; min-width: 220px; }
  button:focus-visible, select:focus-visible, input:focus-visible, textarea:focus-visible, a:focus-visible { outline: 2px solid var(--vermelho); outline-offset: 1px; }
  .controls { display: flex; flex-wrap: wrap; gap: 12px; align-items: end; }
  .controls label { display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 700; }

  .msg { margin: 0; padding: 12px 16px; border-radius: var(--raio); background: var(--branco); border-left: 4px solid var(--amarelo); font-size: 14px; }
  .msg.err { background: var(--vermelho-claro); border-left-color: var(--vermelho); }
  .msg[hidden] { display: none; }
  .lead { margin: 0; color: var(--cinza-texto); max-width: 90ch; font-size: 15px; } .lead b { color: var(--preto); }

  /* Indicadores (KPIs) */
  .tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px; }
  .tile { background: var(--branco); border: 1px solid var(--cinza-borda); border-radius: var(--raio-cartao); padding: 16px 18px; min-width: 0; }
  .tile .lbl { font-size: 13px; font-weight: 500; color: var(--cinza-texto); }
  .tile .val { margin-top: 6px; font-family: var(--f-mono); font-size: 32px; font-weight: 700; line-height: 1.2; }
  .tile .sub { margin-top: 2px; font-size: 12px; color: #666; }
  .tile.bad { border-top: 4px solid var(--vermelho); } .tile.bad .val { color: var(--vermelho); }
  .tile.new { border-top: 4px solid var(--amarelo); }
  .tile.man { border-top: 4px solid var(--preto); }

  /* Cartões */
  .card { background: var(--branco); border: 1px solid var(--cinza-borda); border-radius: var(--raio-cartao); padding: 20px 24px; display: flex; flex-direction: column; gap: 14px; min-width: 0; }
  .note { margin: 0; font-size: 13px; color: var(--cinza-texto); }

  /* Barras por resultado */
  .bars { display: flex; flex-direction: column; gap: 6px; }
  .row { display: grid; grid-template-columns: minmax(0, 20rem) 1fr 3rem; gap: 12px; align-items: center; font-size: 14px; font-weight: 500; height: auto; padding: 5px 6px; border-radius: var(--raio); cursor: pointer; border: 0; background: none; text-align: left; width: 100%; }
  .row:hover { background: var(--amarelo-claro); } .row.sel { background: var(--amarelo-claro); font-weight: 700; } .row.dim { opacity: .45; }
  .row .t { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .row .n { text-align: right; font-family: var(--f-mono); font-weight: 700; }
  .track { height: 16px; background: var(--cinza-fundo); border-radius: 3px; overflow: hidden; }
  .fill { height: 100%; }

  .tools { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: space-between; }
  .tools input { flex: 1 1 240px; max-width: 360px; }
  .chip { height: 28px; font-size: 12px; border-radius: 999px; padding: 0 12px; }

  /* Tabelas */
  .scroll { overflow: auto; max-height: 75vh; border: 1px solid var(--cinza-borda); border-radius: var(--raio); }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th { position: sticky; top: 0; z-index: 1; background: var(--preto); color: var(--branco); text-align: left; font-weight: 700; padding: 10px; white-space: nowrap; }
  td { padding: 10px; border-bottom: 1px solid var(--cinza-linha); vertical-align: top; }
  tbody tr:nth-child(even) td { background: var(--cinza-zebra); }
  td.mono { font-family: var(--f-mono); font-size: 12px; white-space: nowrap; }
  td.res { min-width: 11rem; max-width: 16rem; font-weight: 700; }
  td.tl { min-width: 36rem; }
  td.rota { min-width: 11rem; }
  td.rota b { font-family: var(--f-mono); font-weight: 700; }
  .tl ol { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 3px; }
  .tl li { display: grid; grid-template-columns: 6.4rem 6.8rem 1fr; gap: 6px; font-size: 12px; padding: 2px 4px; border-radius: 3px; font-weight: 400; }
  .tl li.novo { background: var(--amarelo-claro); box-shadow: inset 3px 0 0 var(--amarelo); }
  .tl li.ancora { font-weight: 700; }
  .tl .q { font-family: var(--f-mono); color: var(--cinza-texto); }
  .src { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .02em; }
  .src.historico { color: var(--preto); } .src.aduana { color: var(--vermelho); } .src.carrinho { color: var(--ambar); }
  .src.ps { color: #5A3E8C; } .src.inventario { color: var(--verde); } .src.torre, .src.direcionamento { color: var(--cinza-apagado); }
  .pill { display: inline-block; font-size: 11px; font-weight: 700; border-radius: 999px; padding: 1px 8px; margin-left: 4px; vertical-align: 1px; border: 1px solid currentColor; }
  .pill.man { color: var(--preto); background: var(--amarelo); border-color: var(--amarelo); }
  .pill.novo { color: var(--preto); background: var(--amarelo-claro); border-color: var(--amarelo); }
  .pill.sem { color: var(--vermelho); background: var(--vermelho-claro); border-color: var(--vermelho-claro); }
  .pill.aberta { color: var(--ambar); } .pill.ini { color: var(--preto); margin-left: 0; }
  .sub { display: block; font-size: 12px; font-weight: 400; color: var(--cinza-texto); }
  .empty { text-align: center; color: var(--cinza-texto); padding: 28px 0; }
  footer { font-size: 12px; color: var(--cinza-texto); }
  td.ed { background: var(--amarelo-claro) !important; min-width: 15rem; }
  td.ed input, td.ed textarea { width: 100%; height: auto; font: inherit; font-size: 13px; color: var(--preto); background: var(--branco); border: 1px solid var(--cinza-campo); border-radius: var(--raio); padding: 6px 8px; }
  td.ed textarea { min-height: 3.2em; resize: vertical; margin-top: 4px; }
  .st { font-size: 11px; color: var(--cinza-texto); display: block; min-height: 1em; }
  .st.err { color: var(--vermelho); }
  th.ed { background: var(--amarelo); color: var(--preto); }
  table.tr tr.off td { opacity: .55; } table.tr td.n { text-align: right; font-family: var(--f-mono); font-weight: 700; }
  @media (max-width: 700px) {
    .row { grid-template-columns: minmax(0, 9rem) 1fr 2.6rem; } .tile .val { font-size: 26px; }
    .marca-logo { height: 32px; width: 113px; } .card { padding: 16px; } select { min-width: 0; width: 100%; }
    .controls label { flex: 1 1 100%; }
    .tiles { grid-template-columns: repeat(2, minmax(0, 1fr)); } .tile { padding: 12px 14px; }
  }
</style>

</head>

<div class="wrap">

  <div class="controls">
    <label>Dia analisado<select id="selDia" aria-label="Dia analisado"></select></label>
    <button id="btnVisto" type="button" title="Os bipes que você ainda não tinha visto ficam amarelos. Este botão marca todos como vistos.">Marcar bipes como vistos</button>
    <a id="lnkPlanilha" target="_blank" rel="noopener">Abrir a planilha ↗</a>
  </div>

  <p id="msg" class="msg" role="status" hidden></p>
  <main id="conteudo" style="display:flex;flex-direction:column;gap:18px"></main>
  <footer id="rodape"></footer>
</div>
<datalist id="lista-res"></datalist>

<?!= painelIncluir('Regras') ?>
<script>
(() => {
  const CONFIG = { ATUALIZAR_MIN: 5, JANELA_HORAS: 36 };
  const NOMES = { historico: 'Histórico', carrinho: 'Aud. carrinho', aduana: 'Aduana', ps: 'Problem Solving', inventario: 'Inventário', torre: 'Torre', direcionamento: 'Direcionamento' };
  const SUGESTOES = ['Erro de conteinerização', 'Erro de conteinerização + erro na auditoria', 'Erro na puxada', 'Erro de puxada, etiqueta blanca',
    'Erro de aduana', 'Pacote Avariado', 'Pacote perdido', 'Pacote Perdido Risco de Allowance', 'Pacote no inventário - deslocado - ok'];

  /* ---------- ajudantes ---------- */
  const $ = (s) => document.querySelector(s);
  const norm = (s) => String(s == null ? '' : s).normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/\s+/g, ' ').trim().toLowerCase();
  const pad = (n) => String(n).padStart(2, '0');
  const hm = (d) => pad(d.getHours()) + ':' + pad(d.getMinutes());
  const curto = (d) => pad(d.getDate()) + '/' + pad(d.getMonth() + 1) + ' ' + hm(d);
  const fmt = (n) => Number(n).toLocaleString('pt-BR');
  const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const chamar = (fn, ...args) => new Promise((ok, erro) => google.script.run.withSuccessHandler(ok).withFailureHandler(erro)[fn](...args));

  /* ---------- estado ---------- */
  const S = { dias: [], dia: null, pacotes: [], manual: {}, filtro: null, busca: '', vistosAntes: null, carregando: false, ultima: null, avisos: [], url: '', segundos: 0, regras: [], abaRegras: true };
  const manualDe = (p) => S.manual[p.dia + '|' + p.id] || S.manual['*|' + p.id] || null;
  const resultado = (p) => { const m = manualDe(p); return m && m.classificacao ? m.classificacao : p.regra.resultado; };

  /* ---------- dados (vêm do servidor: Painel.gs) ---------- */
  function prepararPacotes(dados, regras) {
    return dados.pacotes.map((p) => {
      p.inicio = new Date(p.inicio); p.fim = new Date(p.fim);
      p.eventos.forEach((e) => { e.quando = new Date(e.t); });
      p.ancora = p.eventos.find((e) => e.chave === p.ancora) || null;
      try { p.regra = window.REGRAS.classificar(p, regras); } catch (e) { p.regra = { resultado: 'Regra em aberto', codigo: '', regra: '', detalhe: 'Erro nas regras: ' + e.message }; }
      return p;
    });
  }

  async function atualizar(forcar) {
    if (S.carregando) return;
    S.carregando = true; S.forcando = !!forcar; status('load'); $('#btnAtualizar').disabled = true;
    try {
      S.dias = await chamar('painelListarDias');
      if (!S.dias.length) { aviso('Ainda não há faltantes na aba Aduana.'); S.dia = null; S.pacotes = []; render(); return; }
      if (!S.dia || !S.dias.some((d) => d.dia === S.dia)) {
        const h = decodeURIComponent(location.hash.slice(1));
        S.dia = (S.dias.find((d) => d.dia === h) || S.dias[0]).dia;
      }
      desenharDias();
      const r = JSON.parse(await chamar('painelDadosDoDia', S.dia, !!forcar));
      S.abaRegras = Array.isArray(r.regras); S.regras = window.REGRAS.montar(r.regras);
      S.pacotes = prepararPacotes(r.dados, S.regras); S.manual = r.manual || {}; S.avisos = r.dados.avisos || []; S.url = r.url; S.segundos = r.dados.segundos;
      S.geradoEm = new Date(r.dados.geradoEm);
      $('#lnkPlanilha').href = S.url;
      if (S.vistosAntes === null) { S.vistosAntes = lerVistos(); if (!S.vistosAntes) salvarVistos(); }
      S.ultima = new Date();
      aviso('');
      render(); status('ok');
    } catch (e) {
      console.error(e);
      aviso('Não foi possível atualizar: ' + (e && e.message ? e.message : e) + (S.pacotes.length ? ' Mantendo os últimos dados.' : ''), true);
      status('erro');
    } finally {
      S.carregando = false; $('#btnAtualizar').disabled = false;
    }
  }

  /* ---------- bipes novos (desde a última visita, guardado neste navegador) ---------- */
  const chaveVistos = () => 'pf-vistos-' + S.dia;
  function lerVistos() { try { const v = localStorage.getItem(chaveVistos()); return v ? new Set(JSON.parse(v)) : null; } catch (e) { return null; } }
  function salvarVistos() {
    if (!S.pacotes.length) return;
    try { localStorage.setItem(chaveVistos(), JSON.stringify(S.pacotes.flatMap((p) => p.eventos.map((e) => p.id + '|' + e.chave)))); } catch (e) {}
  }
  const ehNovo = (p, e) => !!S.vistosAntes && !S.vistosAntes.has(p.id + '|' + e.chave);

  /* ---------- classificação manual ---------- */
  async function salvar(p, campo, valor, st) {
    const atual = manualDe(p) || { classificacao: '', raciocinio: '' };
    if ((atual[campo] || '') === valor) return;
    const novo = Object.assign({}, atual, { [campo]: valor });
    st.textContent = 'Salvando…'; st.classList.remove('err');
    try {
      const r = await chamar('painelSalvarClassificacao', p.dia, p.id, novo.classificacao || '', novo.raciocinio || '');
      novo.quem = r.quem;
      S.manual[p.dia + '|' + p.id] = novo;
      render();
      const s2 = document.getElementById('st-' + campo + '-' + p.id); if (s2) s2.textContent = 'Salvo';
    } catch (e) {
      st.textContent = 'Não salvou: ' + (e && e.message ? e.message : e); st.classList.add('err');
    }
  }

  /* ---------- tela ---------- */
  const COR = (r) => /erro/i.test(r) ? 'var(--bad)' : /perdid|avaria/i.test(r) ? 'var(--warn)' : /ok\b|deslocado/i.test(r) ? 'var(--ok)' : /em aberto/i.test(r) ? 'var(--open)' : 'var(--man)';

  function render() {
    const m = $('#conteudo');
    if (!S.dia) { m.innerHTML = ''; return; }
    // guarda o foco (o usuário pode estar digitando)
    const ae = document.activeElement, aid = ae && ae.id, aval = ae && 'value' in ae ? ae.value : null, apos = ae && ae.selectionStart;
    const ps = S.pacotes;
    const nSem = ps.filter((p) => !p.temSorting).length;
    const nAbertas = ps.filter((p) => !p.janelaFechada).length;
    const nAberto = ps.filter((p) => /em aberto/i.test(resultado(p))).length;
    const nMan = ps.filter((p) => manualDe(p) && manualDe(p).classificacao).length;
    const nNovos = ps.reduce((a, p) => a + p.eventos.filter((e) => ehNovo(p, e)).length, 0);
    const pacNovos = ps.filter((p) => p.eventos.some((e) => ehNovo(p, e))).length;

    const grupos = new Map();
    for (const p of ps) { const r = resultado(p); grupos.set(r, (grupos.get(r) || 0) + 1); }
    const lista = [...grupos.entries()].sort((a, b) => b[1] - a[1]);
    const max = Math.max(1, ...lista.map((x) => x[1]));
    const q = norm(S.busca);
    const visiveis = ps.filter((p) => (!S.filtro || resultado(p) === S.filtro) && (!q || norm(p.id + ' ' + p.rota + ' ' + p.rep + ' ' + resultado(p)).includes(q)))
      .sort((a, b) => (Number(b.eventos.some((e) => ehNovo(b, e))) - Number(a.eventos.some((e) => ehNovo(a, e)))) || resultado(a).localeCompare(resultado(b)) || a.rota.localeCompare(b.rota) || a.id.localeCompare(b.id));

    $('#lista-res').innerHTML = [...new Set([...SUGESTOES, ...Object.values(S.manual).map((v) => v.classificacao).filter(Boolean)])].map((s) => '<option value="' + esc(s) + '">').join('');
    m.innerHTML = (S.avisos.length ? '<p class="msg err">Atenção: ' + esc(S.avisos.join(' · ')) + '</p>' : '') +
      '<p class="lead">Em <b>' + esc(S.dia) + '</b> a aduana teve <b>' + fmt(ps.length) + '</b> pacotes faltantes. A linha do tempo de cada um começa no <b>sorting</b> (primeiro bipe do pacote no dia na aba Histórico) e vai até ' + CONFIG.JANELA_HORAS + ' h depois; passado esse prazo, não entra mais nada.' +
      (nSem ? ' <b>' + fmt(nSem) + '</b> não tiveram bipe no Histórico no dia (a linha do tempo começa à 00:00).' : '') +
      (nAbertas ? ' <b>' + fmt(nAbertas) + '</b> ainda estão dentro das ' + CONFIG.JANELA_HORAS + ' h e podem receber bipes novos.' : ' A janela de ' + CONFIG.JANELA_HORAS + ' h de todos já encerrou.') + '</p>' +
      '<section class="tiles">' +
        tile('Faltantes', ps.length, 'pacotes únicos na aduana') +
        tile('Com sorting no dia', ps.length - nSem, 'ponto de partida no Histórico') +
        tile('Sem sorting no dia', nSem, 'vale conferir', nSem ? 'bad' : '') +
        tile('Regra em aberto', nAberto, 'sem classificação') +
        tile('Classificados por você', nMan, 'classificação manual', 'man') +
        tile('Bipes novos', nNovos, S.vistosAntes ? 'desde a sua última visita · ' + fmt(pacNovos) + ' pacotes' : 'primeira visita neste navegador', nNovos ? 'new' : '') +
      '</section>' +
      '<section class="card"><h2>Resultado de cada faltante</h2><p class="note">Clique numa barra para filtrar a tabela. Sua classificação manual sempre vence a regra.</p><div class="bars">' +
        lista.map(([r, n]) => '<button type="button" class="row' + (S.filtro === r ? ' sel' : S.filtro ? ' dim' : '') + '" data-r="' + esc(r) + '"><span class="t">' + esc(r) + '</span><span class="track"><span class="fill" style="display:block;width:' + (100 * n / max) + '%;background:' + COR(r) + '"></span></span><span class="n">' + fmt(n) + '</span></button>').join('') +
      '</div></section>' +
      cartaoRegras() +
      '<section class="card" id="tabela"><div class="tools"><h2>Pacote a pacote</h2><input id="busca" type="search" placeholder="Buscar shipment, rota, rep…" value="' + esc(S.busca) + '" aria-label="Buscar"></div>' +
        '<p class="note">Mostrando <b>' + esc(S.filtro || 'todos os resultados') + '</b> · ' + fmt(visiveis.length) + ' pacotes' + (S.filtro ? ' · <button type="button" class="chip" id="limpar">Mostrar todos</button>' : '') +
        ' · Bipes em <span style="background:var(--new-bg);color:var(--new-fg);padding:0 4px;border-radius:3px">amarelo</span> são novos desde a sua última visita. Nas duas últimas colunas você classifica: salva sozinho ao sair do campo.</p>' +
        '<div class="scroll"><table><thead><tr><th>Shipment</th><th>Rota · aduana</th><th>Resultado</th><th>Linha do tempo (sorting + ' + CONFIG.JANELA_HORAS + ' h)</th><th class="ed">Sua classificação</th></tr></thead><tbody>' +
        (visiveis.length ? visiveis.map(linhaPacote).join('') : '<tr><td colspan="5" class="empty">Nenhum pacote.</td></tr>') +
        '</tbody></table></div></section>';

    m.querySelectorAll('.row').forEach((b) => b.onclick = () => { S.filtro = S.filtro === b.dataset.r ? null : b.dataset.r; render(); if (S.filtro) $('#tabela').scrollIntoView({ behavior: 'smooth', block: 'start' }); });
    const l = $('#limpar'); if (l) l.onclick = () => { S.filtro = null; render(); };
    const bx = $('#busca'); let tm;
    bx.oninput = () => { clearTimeout(tm); tm = setTimeout(() => { S.busca = bx.value; render(); }, 250); };
    const porId = new Map(ps.map((p) => [p.id, p]));
    m.querySelectorAll('[data-campo]').forEach((el) => {
      el.onchange = () => { const p = porId.get(el.dataset.id); salvar(p, el.dataset.campo, el.value.trim(), document.getElementById('st-' + el.dataset.campo + '-' + p.id)); };
    });
    if (aid) { const el = document.getElementById(aid); if (el) { if (aval != null && el.value !== aval) el.value = aval; el.focus(); try { if (apos != null) el.setSelectionRange(apos, apos); } catch (e) {} } }
  }

  /* Lista das regras em uso (vem da aba Regras) e quantos pacotes do dia caíram em cada uma. */
  function cartaoRegras() {
    const cont = {};
    for (const p of S.pacotes) if (p.regra.codigo) cont[p.regra.codigo] = (cont[p.regra.codigo] || 0) + 1;
    const link = S.url ? ' <a href="' + esc(S.url) + '" target="_blank" rel="noopener">Editar na planilha ↗</a>' : '';
    const nota = !S.abaRegras
      ? 'A aba <b>Regras</b> ainda não existe na planilha. No Apps Script, rode a função <b>painelCriarAbaRegras</b> uma vez.'
      : 'Na aba <b>Regras</b> você muda a ordem, liga/desliga (coluna Ligada: Sim/Não) e o texto do resultado. A regra é testada de cima para baixo; a primeira que bater classifica o pacote. O que nenhuma cobrir fica <b>Regra em aberto</b>.' + link;
    const linhas = S.regras.map((r) => '<tr' + (r.ligada && r.temLogica ? '' : ' class="off"') + '><td class="mono">' + esc(r.ordem || '') + '</td><td class="mono">' + esc(r.codigo) + '</td><td>' + esc(r.pergunta) +
      (r.observacao ? '<span class="sub">' + esc(r.observacao) + '</span>' : '') + '</td><td>' + esc(r.resultado) + '</td><td>' + (r.ligada ? 'Sim' : 'Não') +
      (r.temLogica ? '' : '<span class="sub st err">sem lógica ainda — pedir ao Claude</span>') + '</td><td class="n">' + fmt(cont[r.codigo] || 0) + '</td></tr>').join('');
    return '<section class="card" id="regras"><h2>Regras em uso</h2><p class="note">' + nota + '</p>' +
      (S.regras.length ? '<div class="scroll"><table class="tr"><thead><tr><th>Ordem</th><th>Código</th><th>Pergunta (se SIM, para aqui)</th><th>Resultado</th><th>Ligada</th><th>Pacotes hoje</th></tr></thead><tbody>' + linhas + '</tbody></table></div>'
        : '<p class="note">Nenhuma regra cadastrada ainda — todos os faltantes ficam como Regra em aberto até você classificar.</p>') + '</section>';
  }

  function tile(lbl, val, sub, cls) { return '<div class="tile ' + (cls || '') + '"><div class="lbl">' + esc(lbl) + '</div><div class="val">' + fmt(val) + '</div><div class="sub">' + esc(sub) + '</div></div>'; }

  function linhaPacote(p) {
    const man = manualDe(p) || {};
    const temMan = !!man.classificacao;
    const novos = p.eventos.filter((e) => ehNovo(p, e)).length;
    const res = '<td class="res">' + esc(resultado(p)) + (temMan ? '<span class="pill man">manual</span>' : '') +
      (temMan && p.regra.resultado !== man.classificacao ? '<span class="sub">Regra: ' + esc(p.regra.resultado) + '</span>' : '') +
      (!temMan && p.regra.regra ? '<span class="sub">' + esc(p.regra.regra) + '</span>' : '') +
      (!temMan && p.regra.detalhe ? '<span class="sub">' + esc(p.regra.detalhe) + '</span>' : '') +
      (temMan && man.quem ? '<span class="sub">por ' + esc(man.quem) + '</span>' : '') + '</td>';
    const tl = p.eventos.length ? '<ol>' + p.eventos.map((e) => '<li class="' + (ehNovo(p, e) ? 'novo ' : '') + (e === p.ancora ? 'ancora' : '') + '"><span class="q">' + curto(e.quando) + '</span><span class="src ' + e.fonte + '">' + esc(NOMES[e.fonte] || e.fonte) + '</span><span>' + (e === p.ancora ? '<span class="pill ini">início</span> ' : '') + esc(e.texto) + '</span></li>').join('') + '</ol>' : '<span class="sub">Nenhum registro na janela.</span>';
    const ed = '<td class="ed"><input type="text" id="c-' + p.id + '" data-id="' + p.id + '" data-campo="classificacao" list="lista-res" placeholder="Escolha ou escreva" value="' + esc(man.classificacao || '') + '" aria-label="Classificação de ' + p.id + '"><span class="st" id="st-classificacao-' + p.id + '"></span>' +
      '<textarea id="r-' + p.id + '" data-id="' + p.id + '" data-campo="raciocinio" placeholder="O que você viu para chegar nessa classificação" aria-label="Raciocínio de ' + p.id + '">' + esc(man.raciocinio || '') + '</textarea><span class="st" id="st-raciocinio-' + p.id + '"></span></td>';
    return '<tr><td class="mono">' + esc(p.id) + (novos ? '<span class="pill novo">' + novos + ' novo' + (novos > 1 ? 's' : '') + '</span>' : '') +
      (p.temSorting ? '' : '<span class="pill sem">sem sorting no dia</span>') + (p.janelaFechada ? '' : '<span class="pill aberta">janela aberta até ' + curto(p.fim) + '</span>') + '</td>' +
      '<td class="rota"><b>' + esc(p.rota) + '</b><span class="sub">' + esc(String(p.horaAduana).slice(0, 5)) + ' · ' + esc(p.rep) + '</span>' + (p.vezesFaltante > 1 ? '<span class="sub">faltante ' + p.vezesFaltante + 'x no dia</span>' : '') + '</td>' +
      res + '<td class="tl">' + tl + '</td>' + ed + '</tr>';
  }

  function aviso(t, erro) { const el = $('#msg'); el.textContent = t || ''; el.hidden = !t; el.classList.toggle('err', !!erro); }
  function status(estado) {
    $('#dot').className = 'dot' + (estado === 'ok' ? '' : estado === 'load' ? ' load' : ' off');
    $('#atualizado').textContent = estado === 'load' ? (S.forcando ? 'Relendo a planilha… pode levar uns 10 s' : 'Atualizando…') : S.geradoEm ? 'Dados preparados às ' + hm(S.geradoEm) + ' · conferido às ' + hm(S.ultima) : 'Sem dados';
  }
  function desenharDias() {
    $('#selDia').innerHTML = S.dias.map((d) => '<option value="' + esc(d.dia) + '"' + (d.dia === S.dia ? ' selected' : '') + '>' + esc(d.dia) + ' · ' + fmt(d.n) + ' faltantes</option>').join('');
  }

  /* ---------- eventos ---------- */
  $('#rodape').textContent = 'Dados ao vivo da planilha "Conteneirização de Pacotes - Base SSP53". Atualiza sozinho a cada ' + CONFIG.ATUALIZAR_MIN + ' min. Regras: ' + (window.REGRAS ? window.REGRAS.versao : '—') + '.';
  $('#btnAtualizar').onclick = () => atualizar(true);
  $('#selDia').onchange = (e) => { salvarVistos(); S.dia = e.target.value; S.vistosAntes = null; S.filtro = null; S.pacotes = []; try { history.replaceState(null, '', '#' + encodeURIComponent(S.dia)); } catch (x) {} atualizar(false); };
  $('#btnVisto').onclick = () => { salvarVistos(); S.vistosAntes = lerVistos(); render(); };
  addEventListener('pagehide', salvarVistos);
  document.addEventListener('visibilitychange', () => { if (document.hidden) salvarVistos(); else atualizar(false); });
  setInterval(() => { if (!document.hidden) atualizar(false); }, CONFIG.ATUALIZAR_MIN * 60 * 1000);
  atualizar(false);
})();
</script>
</body>
</html>
