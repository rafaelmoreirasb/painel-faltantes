<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Painel de Faltantes · SSP53</title>
<style>
  :root { --bg: #f3f5f4; --panel: #fff; --fg: #18211d; --muted: #5b6862; --line: #d4dbd7; --accent: #23584a; color-scheme: light; }
  @media (prefers-color-scheme: dark) { :root { --bg: #121715; --panel: #1a211e; --fg: #e5ebe8; --muted: #9aa8a1; --line: #323d38; --accent: #8cc4b2; color-scheme: dark; } }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 16px/1.55 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 640px; margin: 0 auto; padding: 48px 16px; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 24px; }
  h1 { margin: 0 0 8px; font-size: 26px; } p { color: var(--muted); } a { color: var(--accent); }
</style>
</head>
<body>
<main>
  <div class="card">
    <h1>O painel mudou de endereço</h1>
    <p>A planilha da operação é privada da DHL, então o painel de faltantes agora roda como um site do
      <b>Google Apps Script</b> e só abre para quem estiver logado com conta DHL.</p>
    <p>Peça o link ao Rafael (termina em <code>/exec</code>). O código e o passo a passo estão no
      <a href="https://github.com/rafaelmoreirasb/painel-faltantes/blob/main/docs/painel.md">repositório</a>.</p>
  </div>
</main>
</body>
</html>
